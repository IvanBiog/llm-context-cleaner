<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Cleaner PRO</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Top Bar -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="brand-info">
          <h1>Context Cleaner</h1>
          <span class="subtext">LLM Markdown Extractor</span>
        </div>
      </div>
      <div class="header-right">
        <span class="token-pill" id="token-badge">~0 tokens</span>
        <button id="pro-badge-btn" class="pro-chip" title="License Status">PRO</button>
      </div>
    </header>

    <!-- Metrics Bar -->
    <div class="metrics-row">
      <div class="metric-item">
        <span class="metric-val" id="char-count">0</span>
        <span class="metric-lbl">chars</span>
      </div>
      <div class="metric-divider"></div>
      <div class="metric-item">
        <span class="metric-val" id="word-count">0</span>
        <span class="metric-lbl">words</span>
      </div>
      <div class="metric-divider"></div>
      <div class="metric-item">
        <span class="metric-val" id="reading-time">1m</span>
        <span class="metric-lbl">read</span>
      </div>
    </div>

    <!-- Mode Switcher -->
    <div class="nav-segment">
      <button id="mode-single-btn" class="segment-btn active">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span>Active Tab</span>
      </button>
      <button id="mode-all-btn" class="segment-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
        <span>All Tabs (Batch PRO)</span>
      </button>
    </div>

    <!-- Options Grid -->
    <div class="controls-grid">
      <div class="control-col">
        <label class="field-lbl">Format</label>
        <div class="pill-group">
          <label class="pill-opt">
            <input type="radio" name="format" value="markdown" checked>
            <span>Markdown</span>
          </label>
          <label class="pill-opt">
            <input type="radio" name="format" value="text">
            <span>Text</span>
          </label>
          <label class="pill-opt">
            <input type="radio" name="format" value="llm-xml">
            <span>XML</span>
          </label>
        </div>
      </div>
      <div class="control-col">
        <label class="field-lbl">Preset</label>
        <select id="prompt-preset" class="custom-select">
          <option value="none">Clean Content Only</option>
          <option value="summarize">TL;DR / Key Insights</option>
          <option value="code_audit">Code & Architecture Audit</option>
          <option value="fact_check">Fact-Check Claims</option>
          <option value="qa_study">Q&A Study Cards</option>
        </select>
      </div>
    </div>

    <!-- Live Preview -->
    <div class="preview-container">
      <div class="preview-meta">
        <span class="preview-label">Live Output Preview</span>
        <button id="refresh-btn" class="icon-action-btn" title="Re-extract content">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
          </svg>
        </button>
      </div>
      <textarea id="preview-text" spellcheck="false" placeholder="Waiting for extraction..." readonly></textarea>
    </div>

    <!-- Primary Action Bar -->
    <div class="action-bar">
      <button id="copy-btn" class="btn-primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copy-text">Copy Context</span>
      </button>
    </div>

    <!-- PRO License Drawer -->
    <div id="license-panel" class="license-drawer hidden">
      <div class="drawer-header">
        <div class="drawer-title">
          <span class="star-badge">PRO</span>
          <span>Unlock Full Lifetime Suite</span>
        </div>
        <button id="close-license-btn" class="drawer-close">&times;</button>
      </div>
      <p class="drawer-desc">Gain unlimited multi-tab merges, custom model headers, and priority token optimization.</p>
      <div class="drawer-input-row">
        <input type="text" id="license-key-input" placeholder="Enter License Key..." />
        <button id="activate-license-btn" class="btn-activate">Activate</button>
      </div>
      <div class="drawer-footer">
        <a href="https://buymeacoffee.com/uilifetools/e/597182" target="_blank" class="buy-link">Get Lifetime License ($9) &rarr;</a>
      </div>
    </div>

    <div id="status-msg" class="status-indicator">Ready</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
