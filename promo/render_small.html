<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    width: 440px;
    height: 280px;
    background: #090d16;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Background glow orbs */
  .orb1 {
    position: absolute;
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(0,0,0,0) 70%);
    top: -60px;
    left: -40px;
    filter: blur(30px);
  }
  .orb2 {
    position: absolute;
    width: 240px;
    height: 240px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(0,0,0,0) 70%);
    bottom: -60px;
    right: -40px;
    filter: blur(30px);
  }
  /* Glass card container */
  .card {
    position: relative;
    width: 400px;
    height: 240px;
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-box {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
  }
  .brand-text h2 {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.3px;
  }
  .brand-text span {
    font-size: 10px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
  }
  .pro-pill {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.2));
    border: 1px solid rgba(245, 158, 11, 0.5);
    color: #fbbf24;
    font-size: 10px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
  .mid-section {
    margin: 8px 0;
  }
  .headline {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.25;
    background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub-headline {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 4px;
    line-height: 1.4;
  }
  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 10px;
  }
  .ai-badges {
    display: flex;
    gap: 6px;
  }
  .ai-tag {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #e2e8f0;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .status-tag {
    font-size: 10px;
    color: #38bdf8;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .pulse-dot {
    width: 6px;
    height: 6px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
  }
</style>
</head>
<body>
  <div class="orb1"></div>
  <div class="orb2"></div>
  
  <div class="card">
    <div class="top-row">
      <div class="brand">
        <div class="logo-box">⚡</div>
        <div class="brand-text">
          <h2>Context Cleaner</h2>
          <span>Markdown Extractor</span>
        </div>
      </div>
      <div class="pro-pill">⭐ BATCH PRO</div>
    </div>

    <div class="mid-section">
      <div class="headline">Zero Noise. Pure Context.</div>
      <div class="sub-headline">Batch-merge 10+ tabs into clean XML & Markdown in 1 click without Cloudflare blocks.</div>
    </div>

    <div class="bottom-row">
      <div class="ai-badges">
        <div class="ai-tag">ChatGPT</div>
        <div class="ai-tag">Claude</div>
        <div class="ai-tag">Gemini</div>
      </div>
      <div class="status-tag">
        <div class="pulse-dot"></div>
        <span>100% Offline</span>
      </div>
    </div>
  </div>
</body>
</html>
